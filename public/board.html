<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>RUN/HACK board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600&family=Geist:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F3EF; --navy: #08182F; --blue: #1311D1;
    --orange: #DD6A24; --gold: #F0BE2A; --sky: #3A90E6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: 'Geist', system-ui, sans-serif; margin: 0; background: var(--navy); color: var(--paper);
         display: flex; flex-direction: column; }
  main { flex: 1; min-height: 0; overflow-y: auto; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }

  header { background: var(--blue); padding: 18px 32px; display: flex; align-items: center; gap: 24px;
           border-bottom: 4px solid var(--gold); flex-wrap: wrap; }
  .wordmark { font-weight: 900; font-size: 34px; letter-spacing: -1.5px; white-space: nowrap; line-height: 1; }
  .wordmark .slash { color: var(--orange); }
  .powered { display: flex; align-items: center; gap: 7px; margin-top: 5px;
             font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.28em;
             text-transform: uppercase; color: rgba(244,243,239,0.55); }
  .powered img { height: 13px; display: block; }
  .eventname { font-family: 'Geist Mono', monospace; text-transform: uppercase; letter-spacing: 0.15em;
               font-size: 13px; color: rgba(244,243,239,0.7); }
  .spacer { flex: 1; }

  /* countdown — "starting gun" style */
  #gun { display: flex; gap: 2px; align-items: stretch; }
  .gun-cell { background: rgba(8,24,47,0.55); padding: 6px 14px; text-align: center; min-width: 72px; }
  .gun-cell b { display: block; font-family: 'Geist Mono', monospace; font-size: 30px; font-weight: 600; }
  .gun-cell span { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.2em;
                   color: rgba(244,243,239,0.55); text-transform: uppercase; }
  .gun-label { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em;
               text-transform: uppercase; align-self: center; margin-right: 10px; color: var(--gold); }
  .gun-final b { color: var(--orange); }

  .rulebar { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
             padding: 8px 32px; color: rgba(244,243,239,0.5); border-bottom: 1px solid rgba(244,243,239,0.1);
             display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 21px; }
  th { text-align: left; color: rgba(244,243,239,0.45); font-family: 'Geist Mono', monospace; font-size: 11px;
       text-transform: uppercase; letter-spacing: 0.15em; padding: 14px 16px 6px; font-weight: 400; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td { padding: 13px 16px; border-top: 1px solid rgba(244,243,239,0.08); }
  td.rank { color: rgba(244,243,239,0.35); width: 44px; font-family: 'Geist Mono', monospace; }
  .move { display: block; font-size: 10px; line-height: 1; margin-top: 2px; }
  .move.up { color: #4ade80; }
  .move.down { color: var(--orange); }
  tr.first td.rank, tr.first td.score { color: var(--gold); }
  td.team { font-weight: 700; }
  td.score { font-weight: 900; color: var(--sky); font-size: 24px; }
  td.km { color: var(--orange); font-weight: 700; }
  .runner { color: rgba(244,243,239,0.65); font-size: 15px; }
  .idle-now { color: #ff5a5a; font-weight: 700; animation: blink 1s step-end infinite; }
  .idle-count { color: #ffb020; font-weight: 600; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
  .running { background: #4ade80; box-shadow: 0 0 8px #4ade80; } .stopped { background: var(--gold); } .idle { background: #333f52; }
  .lap-valid { color: #4ade80; } .lap-invalid { color: var(--orange); }
  tr.rowlink { cursor: pointer; }
  tr.rowlink:hover td { background: rgba(244,243,239,0.04); }

  /* phones: rank · team · runner · laps · km · score; commits + lap detail
     live on the team page a tap away */
  @media (max-width: 760px) {
    header { padding: 10px 14px; gap: 10px; }
    .wordmark { font-size: 22px; letter-spacing: -1px; }
    .powered { margin-top: 3px; }
    .powered img { height: 10px; }
    .eventname { display: none; }
    .gun-cell { min-width: 44px; padding: 3px 7px; }
    .gun-cell b { font-size: 18px; }
    .gun-cell span { font-size: 8px; }
    .gun-label { font-size: 9px; margin-right: 4px; }
    .rulebar { padding: 6px 14px; font-size: 9px; gap: 4px; flex-wrap: nowrap; }
    .pacerule { display: none; }
    .ryb { display: none; }
    table { font-size: 15px; }
    th, td { padding: 8px 5px; }
    td.rank { width: 22px; }
    .runner { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
              display: inline-block; vertical-align: middle; }
    th:nth-child(6), td:nth-child(6),
    th:nth-child(8), td:nth-child(8),
    th:nth-child(9), td:nth-child(9),
    th:nth-child(10), td:nth-child(10) { display: none; }
    td.score { font-size: 16px; }
    .runner { font-size: 12px; max-width: 56px; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; display: inline-block; vertical-align: middle; }
    td.team { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.team .commitline { max-width: 32vw; font-size: 9px; }
    #state { padding: 44px 16px 20px; }
    #state .big { font-size: 28px; }
    #state .sub { font-size: 10px; }
  }
  .lap-reason { font-family: 'Geist Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
                color: rgba(244,243,239,0.4); display: block; }
  .commitline { display: block; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 400;
                color: rgba(244,243,239,0.45); margin-top: 3px; max-width: 340px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }

  #state { text-align: center; padding: 70px 24px 30px; }
  #state .big { font-weight: 900; font-size: 44px; letter-spacing: -1px; }
  #state .big .accent { color: var(--gold); }
  #state .sub { font-family: 'Geist Mono', monospace; font-size: 13px; letter-spacing: 0.15em;
                text-transform: uppercase; color: rgba(244,243,239,0.5); margin-top: 14px; }
  #updated { color: rgba(244,243,239,0.5); }
  #updated.stale { color: var(--orange); }

</style>
</head>
<body>
<header>
  <div>
    <a href="/" style="color:inherit;text-decoration:none"><div class="wordmark">RUN<span class="slash">/</span>HACK</div></a>
    <div class="powered">Powered by <img src="/brands/02-roxfit.png" alt="ROXFIT"></div>
  </div>
  <div class="eventname" id="eventname"></div>
  <div class="spacer"></div>
  <div class="gun-label" id="gunlabel"></div>
  <div id="gun"></div>
</header>
<div class="rulebar">
  <span id="scoreRule">You run. You build.</span>
  <span id="updated"></span>
  <span class="pacerule">Pace rule: slower than 7'00"/km isn't running.</span>
</div>
<main>
  <div id="state" style="display:none"></div>
  <table>
    <thead><tr>
      <th></th><th>Team</th><th>Runner</th>
      <th class="num">Laps</th><th class="num">KM</th><th class="num">Commits</th>
      <th class="num">Score</th><th class="num">Last lap</th><th class="num">Avg lap</th>
      <th class="num" title="Nobody-sits-down violations: >15s with no one running">Idle</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<footer id="sponsor-bar"></footer>
<script src="/sponsor-bar.js"></script>

<script>
const slug = location.pathname.split('/')[1];
let board = null;
let clockSkewMs = 0;
let lastFetchOkAt = null;
const pageOpenedAt = Date.now();

function fmtPace(s) {
  if (s == null) return '—';
  return `${Math.floor(s / 60)}'${String(Math.round(s % 60)).padStart(2, '0')}"/km`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtAgo(s) {
  if (s == null) return '';
  if (s < 90) return `${s}s ago`;
  if (s < 5400) return `${Math.round(s / 60)}m ago`;
  return `${Math.round(s / 3600)}h ago`;
}

const REASONS = { too_fast: 'GPS bounce', too_slow: 'too slow', outside_window: 'outside race', too_soon: 'double count' };

async function tick() {
  try {
    const r = await fetch(`/api/${slug}/board`);
    if (!r.ok) return;
    board = await r.json();
    lastFetchOkAt = Date.now();
    clockSkewMs = new Date(board.serverNow).getTime() - Date.now();
    document.getElementById('eventname').textContent = board.event;
    document.getElementById('scoreRule').innerHTML =
      '<span class="ryb">You run. You build. </span>Score = ' +
      (board.scoreFormula === 'km_plus_commits' ? 'km + weighted commits.' : 'km x commits.');
    renderState();
    document.getElementById('rows').innerHTML = board.teams.map((t, i) => {
      const move = t.move
        ? `<span class="move ${t.move}">${t.move === 'up' ? '▲' : '▼'}</span>` : '';
      const lap = t.lastLap;
      const lapCell = lap
        ? `<span class="${lap.valid ? 'lap-valid' : 'lap-invalid'}">${lap.seconds}s ${lap.valid ? '✓' : '✕'}</span>` +
          (lap.valid
            ? `<span class="lap-reason">${fmtPace(lap.paceSPerKm)}</span>`
            : `<span class="lap-reason">${REASONS[lap.reason] || lap.reason || 'invalid'}</span>`)
        : '—';
      const avgCell = t.avgLap
        ? `<span>${t.avgLap.seconds}s</span><span class="lap-reason">${fmtPace(t.avgLap.paceSPerKm)}</span>`
        : '—';
      const idleCell = t.idleNow
        ? `<span class="idle-now">● SITTING</span><span class="lap-reason">${t.infractions}× · ${t.idleSeconds}s</span>`
        : t.infractions > 0
          ? `<span class="idle-count">${t.infractions}×</span><span class="lap-reason">${t.idleSeconds}s idle</span>`
          : '—';
      const commit = t.lastCommit
        ? `<span class="commitline" title="${esc(t.lastCommit.author || '')}">↑ ${esc(t.lastCommit.message)} · ${fmtAgo(t.lastCommit.agoS)}</span>`
        : '';
      return `<tr class="${i === 0 ? 'first' : ''} rowlink" onclick="location.href='/${slug}/team/${t.teamId}'">
        <td class="rank">${String(i + 1).padStart(2, '0')}${move}</td>
        <td class="team">${esc(t.team)}${commit}</td>
        <td><span class="dot ${t.status}"></span><span class="runner">${t.runner ? esc(t.runner) : '—'}</span></td>
        <td class="num">${t.laps}</td>
        <td class="num km">${t.km.toFixed(1)}</td>
        <td class="num">${t.commits}</td>
        <td class="num score">${t.score}</td>
        <td class="num">${lapCell}</td>
        <td class="num">${avgCell}</td>
        <td class="num">${idleCell}</td>
      </tr>`;
    }).join('');
  } catch {}
}

// Pre-race / quiet-race states. The table stays visible underneath so team
// names are on screen before the gun.
function renderState() {
  const el = document.getElementById('state');
  if (!board) {
    // never loaded: after a few seconds show an explicit no-signal state
    if (Date.now() - pageOpenedAt > 6000) {
      el.innerHTML = `<div class="big">NO <span class="accent">SIGNAL</span></div>
        <div class="sub">Can't reach the race clock — retrying…</div>`;
      el.style.display = 'block';
    }
    return;
  }
  const nothingYet = board.teams.every((t) => t.laps === 0 && !t.runner);
  if (board.status === 'paused') {
    el.innerHTML = `<div class="big">RACE <span class="accent">PAUSED</span></div>
      <div class="sub">Hold tight — laps don't count until we resume</div>`;
    el.style.display = 'block';
  } else if (board.status === 'upcoming') {
    el.innerHTML = `<div class="big">NOBODY <span class="accent">SITS DOWN</span></div>
      <div class="sub">Race hasn't started · scan your team QR to get set</div>`;
    el.style.display = 'block';
  } else if (board.status === 'live' && board.teams.length === 0) {
    el.innerHTML = `<div class="big">NO TEAMS <span class="accent">YET</span></div>
      <div class="sub">Teams appear here as they're created</div>`;
    el.style.display = 'block';
  } else if (board.status === 'live' && nothingYet) {
    el.innerHTML = `<div class="big">THE RACE IS <span class="accent">LIVE</span></div>
      <div class="sub">Waiting for the first runners · scan your team QR and go</div>`;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function renderUpdated() {
  const el = document.getElementById('updated');
  if (!lastFetchOkAt) { el.textContent = 'Connecting…'; return; }
  const ago = Math.round((Date.now() - lastFetchOkAt) / 1000);
  const t = ago < 90 ? `${ago}s` : `${Math.round(ago / 60)}m`;
  el.textContent = ago <= 3 ? '✓ live' : ago > 20 ? `⚠ ${t}` : `✓ ${t}`;
  el.classList.toggle('stale', ago > 20);
}

function renderGun() {
  const label = document.getElementById('gunlabel');
  const gun = document.getElementById('gun');
  if (!board || (!board.startAt && !board.endAt)) { label.textContent = ''; gun.innerHTML = ''; return; }
  const now = Date.now() + clockSkewMs;
  const start = board.startAt ? new Date(board.startAt).getTime() : null;
  const end = board.endAt ? new Date(board.endAt).getTime() : null;

  let target = null;
  if (board.status === 'paused') {
    label.textContent = '';
    gun.innerHTML = '<div class="gun-cell gun-final"><b>PAUSED</b><span>hold</span></div>';
    return;
  }
  let countUp = false;
  if (start && now < start) { label.textContent = 'Starts in'; target = start; }
  else if (end && now < end) { label.textContent = 'Time left'; target = end; }
  else if (end) {
    label.textContent = '';
    gun.innerHTML = '<div class="gun-cell gun-final"><b>FINISHED</b><span>race over</span></div>';
    return;
  } else if (start) { label.textContent = 'Elapsed'; target = start; countUp = true; }
  else { label.textContent = 'Race is live'; gun.innerHTML = ''; return; }

  let s = Math.max(0, Math.floor((countUp ? now - target : target - now) / 1000));
  const parts = [['days', 86400], ['hrs', 3600], ['min', 60], ['sec', 1]].map(([u, div]) => {
    const v = Math.floor(s / div); s -= v * div; return [u, v];
  }).filter(([u, v], i, a) => v > 0 || u === 'sec' || a.slice(0, i).some(([, pv]) => pv > 0));
  gun.innerHTML = parts.map(([u, v]) =>
    `<div class="gun-cell"><b>${String(v).padStart(u === 'days' ? 3 : 2, '0')}</b><span>${u}</span></div>`).join('');
}

setInterval(tick, 3000);
setInterval(() => { renderGun(); renderUpdated(); if (!board) renderState(); }, 1000);
tick();
</script>
</body>
</html>
